name: Refresh map data

on:
  schedule:
    - cron: "17 4 * * 1"   # every Monday 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/areas.json", "scripts/refresh_data.py"]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch OpenStreetMap and police.uk data
        run: python3 scripts/refresh_data.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/osm.json data/crime.json
          git diff --cached --quiet || git commit -m "Refresh map data ($(date -u +%Y-%m-%d))"
          git push
